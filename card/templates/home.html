<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLYMPUS: Champions & History</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* ==================== RESET ==================== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #c9a558;
    --gold-bright: #e8c878;
    --gold-dark: #8b6914;
    --stone: #d9cfbd;
    --stone-dark: #a89878;
    --ink: #2a1f14;
    --bg-deep: #1a1410;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Cormorant Garamond', serif;
    background: #0a0805;
    user-select: none;
  }

  /* ==================== CENA DE FUNDO ==================== */
  .scene {
    position: fixed;
    inset: 0;
    background-image: url('https://images.unsplash.com/photo-1552832230-c0197dd311b5?w=1920&q=80');
    background-size: cover;
    background-position: center;
    /* Placeholder — troque por sua arte do Olimpo */
    filter: saturate(0.85) contrast(1.05);
  }

  /* Overlay escuro nas laterais (vinheta cinematográfica) */
  .scene::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at center 40%, transparent 20%, rgba(0,0,0,0.55) 100%),
      linear-gradient(90deg, rgba(0,0,0,0.75) 0%, transparent 22%, transparent 78%, rgba(0,0,0,0.75) 100%),
      linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.5) 100%);
    pointer-events: none;
  }

  /* ==================== TÍTULO CENTRAL ==================== */
  .title-wrap {
    position: absolute;
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 5;
    pointer-events: none;
  }

  .title-main {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: clamp(48px, 7vw, 96px);
    letter-spacing: 6px;
    color: #e8d9b0;
    text-shadow:
      0 0 2px #2a1f14,
      0 2px 0 #6b4f1e,
      0 4px 0 #4a3612,
      0 6px 0 #2a1f14,
      0 8px 18px rgba(0,0,0,0.9),
      0 0 40px rgba(232, 200, 120, 0.35);
    line-height: 1;
    position: relative;
  }

  .title-main::before {
    content: '';
    position: absolute;
    inset: -20px -40px;
    background: radial-gradient(ellipse, rgba(232,200,120,0.15), transparent 70%);
    z-index: -1;
  }

  .title-sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(20px, 2.4vw, 34px);
    color: #f4e4c1;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9), 0 0 20px rgba(232,200,120,0.4);
    margin-top: -8px;
    letter-spacing: 2px;
  }

  /* ==================== PAINEL SUPERIOR ESQUERDO (PLAYER) ==================== */
  .player-panel {
    position: absolute;
    top: 18px;
    left: 18px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* Moldura de mármore reutilizável */
  .marble-frame {
    background:
      linear-gradient(180deg, #efe6d0 0%, #d9cfbd 40%, #b8a986 100%);
    border: 2px solid #6b4f1e;
    border-radius: 6px;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.4),
      inset 0 -4px 8px rgba(107,79,30,0.35),
      0 4px 12px rgba(0,0,0,0.7),
      0 0 0 1px rgba(0,0,0,0.6);
    position: relative;
  }

  .marble-frame::before {
    content: '';
    position: absolute;
    inset: 3px;
    border: 1px solid rgba(107,79,30,0.35);
    border-radius: 4px;
    pointer-events: none;
  }

  .avatar-frame {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    padding: 3px;
    background:
      linear-gradient(180deg, #efe6d0 0%, #d9cfbd 40%, #b8a986 100%);
    border: 2px solid #6b4f1e;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.5),
      0 4px 12px rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }

  .avatar-frame img,
  .avatar-frame .avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background:
      radial-gradient(circle at 40% 30%, #8b6a4a 0%, #5a3f28 60%, #2a1f14 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: #e8d9b0;
    border: 1px solid #4a3612;
  }

  .player-stats {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .player-name {
    background:
      linear-gradient(180deg, #efe6d0 0%, #d9cfbd 40%, #b8a986 100%);
    border: 2px solid #6b4f1e;
    border-radius: 4px;
    padding: 3px 14px 3px 12px;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 14px;
    color: #2a1f14;
    letter-spacing: 1px;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.4),
      inset 0 -3px 6px rgba(107,79,30,0.3),
      0 3px 8px rgba(0,0,0,0.6);
    text-align: center;
    min-width: 130px;
  }

  .xp-bar-wrap {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .xp-bar {
    width: 110px;
    height: 12px;
    background: #2a1f14;
    border: 1px solid #6b4f1e;
    border-radius: 3px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
    overflow: hidden;
    position: relative;
  }

  .xp-fill {
    height: 100%;
    width: 42%;
    background: linear-gradient(180deg, #f4d03f 0%, #c9a558 50%, #8b6914 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
    transition: width 0.4s;
  }

  .level-badge {
    position: absolute;
    left: -38px;
    top: 50%;
    transform: translateY(-50%);
    width: 30px;
    height: 30px;
    background:
      radial-gradient(circle at 35% 30%, #f4d03f 0%, #c9a558 60%, #6b4f1e 100%);
    border: 2px solid #4a3612;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 13px;
    color: #2a1f14;
    box-shadow:
      inset 0 -3px 5px rgba(0,0,0,0.4),
      inset 0 2px 3px rgba(255,255,255,0.5),
      0 2px 6px rgba(0,0,0,0.7);
    z-index: 2;
  }

  /* ==================== MOEDAS SUPERIOR DIREITO ==================== */
  .currency-panel {
    position: absolute;
    top: 18px;
    right: 18px;
    z-index: 10;
    display: flex;
    gap: 22px;
    align-items: center;
  }

  .currency-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .coin {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 900;
    color: #4a3612;
    position: relative;
    box-shadow:
      inset 0 0 0 2px rgba(255,255,255,0.3),
      inset 0 -4px 6px rgba(0,0,0,0.3),
      0 3px 8px rgba(0,0,0,0.8);
    border: 2px solid #4a3612;
  }

  .coin.silver {
    background: radial-gradient(circle at 35% 30%, #f0f0f0 0%, #b8b8b8 50%, #6a6a6a 100%);
  }

  .coin.gold {
    background: radial-gradient(circle at 35% 30%, #f8e08a 0%, #d4af37 50%, #8b6914 100%);
  }

  .coin::after {
    content: '';
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    border: 1px dashed rgba(74,54,18,0.5);
  }

  .coin-label {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 14px;
    color: #f4e4c1;
    text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 1px 0 #000;
    letter-spacing: 0.5px;
  }

  /* ==================== MENU LATERAL ESQUERDO ==================== */
  .menu-left {
    position: absolute;
    top: 50%;
    left: 30px;
    transform: translateY(-50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .menu-plate {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 1.5px;
    color: #2a1f14;
    text-align: center;
    text-transform: uppercase;
    padding: 14px 26px;
    min-width: 210px;
    cursor: pointer;
    background:
      linear-gradient(180deg, #efe6d0 0%, #d9cfbd 45%, #b8a986 100%);
    border: 2px solid #6b4f1e;
    border-radius: 5px;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.5),
      inset 0 -4px 8px rgba(107,79,30,0.4),
      inset 0 3px 4px rgba(255,255,255,0.35),
      0 5px 14px rgba(0,0,0,0.75),
      0 0 0 1px rgba(0,0,0,0.6);
    position: relative;
    transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
    text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }

  .menu-plate::before,
  .menu-plate::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 10px;
    height: 10px;
    transform: translateY(-50%) rotate(45deg);
    background: linear-gradient(135deg, #c9a558, #6b4f1e);
    border: 1px solid #4a3612;
    box-shadow: 0 0 4px rgba(0,0,0,0.6);
  }

  .menu-plate::before { left: -5px; }
  .menu-plate::after { right: -5px; }

  .menu-plate:hover {
    transform: translateX(6px);
    filter: brightness(1.08);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.6),
      inset 0 -4px 8px rgba(107,79,30,0.4),
      inset 0 3px 4px rgba(255,255,255,0.4),
      0 6px 18px rgba(0,0,0,0.85),
      0 0 24px rgba(232,200,120,0.5),
      0 0 0 1px rgba(0,0,0,0.6);
  }

  .menu-plate:active { transform: translateX(6px) scale(0.98); }

  /* ==================== CARTAS EM LEQUE (CENTRO-BAIXO) ==================== */
  .cards-fan {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 8;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    perspective: 1200px;
  }

  .game-card {
    width: 172px;
    height: 244px;
    border-radius: 10px;
    position: relative;
    cursor: pointer;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: bottom center;
    box-shadow:
      0 10px 25px rgba(0,0,0,0.7),
      0 0 0 1px rgba(0,0,0,0.6);
    overflow: hidden;
    background: #1a1410;
  }

  /* Moldura de mármore das cartas */
  .game-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border: 4px solid #6b4f1e;
    border-radius: 10px;
    background:
      linear-gradient(180deg, #efe6d0 0%, #d9cfbd 30%, #b8a986 100%);
    z-index: 2;
    pointer-events: none;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.5),
      inset 0 0 20px rgba(107,79,30,0.3);
    clip-path: polygon(
      0 0, 100% 0, 100% 100%, 0 100%,
      0 92%, 6% 88%, 6% 12%, 0 8%
    );
  }

  /* Área da imagem */
  .card-portrait {
    position: absolute;
    top: 14px;
    left: 14px;
    right: 14px;
    bottom: 74px;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid #4a3612;
    background: #2c1810;
    z-index: 1;
  }

  .card-portrait img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(0.9) contrast(1.08);
    display: block;
  }

  /* Fallback quando não tiver imagem */
  .card-portrait .placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 72px;
    background:
      radial-gradient(circle at 50% 40%, #6b4f1e 0%, #2c1810 80%);
  }

  /* Nome na parte inferior */
  .card-nameplate {
    position: absolute;
    bottom: 12px;
    left: 10px;
    right: 10px;
    height: 46px;
    background:
      linear-gradient(180deg, #f4ecd8 0%, #e0d5ba 100%);
    border: 1px solid #6b4f1e;
    border-radius: 3px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 3;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.6),
      inset 0 -3px 6px rgba(107,79,30,0.25),
      0 2px 4px rgba(0,0,0,0.5);
  }

  .card-nameplate .nome {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 12px;
    color: #2a1f14;
    letter-spacing: 0.5px;
    text-align: center;
    line-height: 1.1;
  }

  .card-nameplate .subtitulo {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 10px;
    color: #6b4f1e;
    margin-top: 1px;
  }

  /* Custo (canto superior esquerdo) */
  .card-cost {
    position: absolute;
    top: 6px;
    left: 6px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, #f8e08a 0%, #d4af37 55%, #8b6914 100%);
    border: 2px solid #4a3612;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 14px;
    color: #2a1f14;
    z-index: 4;
    box-shadow:
      inset 0 -3px 5px rgba(0,0,0,0.35),
      inset 0 2px 3px rgba(255,255,255,0.5),
      0 2px 5px rgba(0,0,0,0.6);
  }

  /* Stats inferior */
  .card-stats {
    position: absolute;
    bottom: 4px;
    left: 6px;
    right: 6px;
    display: flex;
    justify-content: space-between;
    z-index: 4;
  }

  .stat-badge {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 14px;
    border: 2px solid #4a3612;
    box-shadow:
      inset 0 -3px 5px rgba(0,0,0,0.35),
      inset 0 2px 3px rgba(255,255,255,0.4),
      0 2px 6px rgba(0,0,0,0.7);
  }

  .stat-badge.atk {
    background: radial-gradient(circle at 35% 30%, #f8e08a 0%, #d4af37 55%, #8b6914 100%);
    color: #2a1f14;
  }

  .stat-badge.hp {
    background: radial-gradient(circle at 35% 30%, #ff8a80 0%, #c62828 55%, #6b0f0f 100%);
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }

  /* Carta central em destaque */
  .game-card.featured {
    transform: translateY(-18px) scale(1.06);
    z-index: 5;
    box-shadow:
      0 18px 40px rgba(0,0,0,0.85),
      0 0 0 1px rgba(0,0,0,0.6),
      0 0 40px rgba(232,200,120,0.35);
  }

  .game-card:not(.featured):hover {
    transform: translateY(-24px) scale(1.08);
    z-index: 6;
  }

  /* Leve rotação para efeito de leque */
  .game-card:nth-child(1) { transform: rotate(-3deg) translateY(6px); }
  .game-card:nth-child(3) { transform: rotate(3deg) translateY(6px); }
  .game-card:nth-child(1).featured { transform: rotate(-3deg) translateY(-12px) scale(1.04); }
  .game-card:nth-child(3).featured { transform: rotate(3deg) translateY(-12px) scale(1.04); }
  .game-card:nth-child(1):hover { transform: rotate(-3deg) translateY(-22px) scale(1.08); }
  .game-card:nth-child(3):hover { transform: rotate(3deg) translateY(-22px) scale(1.08); }

  /* ==================== EVENTO (CANTO INFERIOR DIREITO) ==================== */
  .event-panel {
    position: absolute;
    bottom: 30px;
    right: 30px;
    z-index: 10;
    padding: 20px 22px 22px;
    width: 280px;
    background:
      linear-gradient(180deg, rgba(30,22,15,0.95) 0%, rgba(15,10,6,0.98) 100%);
    border: 2px solid #6b4f1e;
    border-radius: 8px;
    box-shadow:
      inset 0 0 0 1px rgba(232,200,120,0.25),
      inset 0 2px 20px rgba(0,0,0,0.6),
      0 10px 30px rgba(0,0,0,0.85),
      0 0 40px rgba(232,200,120,0.15);
    text-align: center;
  }

  .event-panel::before {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(201,165,88,0.3);
    border-radius: 5px;
    pointer-events: none;
  }

  .event-label {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 3px;
    color: #c9a558;
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .event-title {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 20px;
    line-height: 1.15;
    color: #f4e4c1;
    text-shadow:
      0 2px 4px rgba(0,0,0,0.9),
      0 0 20px rgba(232,200,120,0.4);
    letter-spacing: 1px;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(201,165,88,0.35);
    position: relative;
  }

  .event-title::after {
    content: '❖';
    position: absolute;
    bottom: -9px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a1410;
    color: #c9a558;
    padding: 0 8px;
    font-size: 12px;
  }

  .btn-jogar {
    display: inline-block;
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 15px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #2a1f14;
    padding: 13px 30px;
    cursor: pointer;
    background:
      linear-gradient(180deg, #f4d97a 0%, #d4af37 45%, #a8801c 100%);
    border: 2px solid #4a3612;
    border-radius: 6px;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.5),
      inset 0 -4px 8px rgba(107,79,30,0.5),
      inset 0 3px 4px rgba(255,255,255,0.5),
      0 4px 14px rgba(0,0,0,0.7),
      0 0 30px rgba(232,200,120,0.4);
    transition: all 0.25s;
    position: relative;
    text-shadow: 0 1px 0 rgba(255,255,255,0.4);
    width: 100%;
  }

  .btn-jogar:hover {
    filter: brightness(1.12);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.6),
      inset 0 -4px 8px rgba(107,79,30,0.5),
      inset 0 3px 4px rgba(255,255,255,0.6),
      0 6px 18px rgba(0,0,0,0.8),
      0 0 45px rgba(232,200,120,0.7);
    transform: translateY(-2px);
  }

  .btn-jogar:active { transform: translateY(0); }

  /* ==================== BOTÃO CENTRAL DE PLAY ==================== */
  .play-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    text-align: center;
  }

  .btn-play-main {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 28px;
    letter-spacing: 5px;
    color: #2a1f14;
    padding: 24px 60px;
    cursor: pointer;
    background: linear-gradient(180deg, #f4d97a 0%, #d4af37 45%, #a8801c 100%);
    border: 3px solid #4a3612;
    border-radius: 12px;
    box-shadow: 
      inset 0 0 0 1px rgba(255,255,255,0.5),
      0 10px 30px rgba(0,0,0,0.8),
      0 0 50px rgba(232,200,120,0.4);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-shadow: 0 2px 0 rgba(255,255,255,0.4);
    position: relative;
    overflow: hidden;
  }

  .btn-play-main::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
    transform: rotate(45deg);
    animation: shine 4s infinite;
  }

  @keyframes shine {
    0% { left: -100%; }
    20% { left: 100%; }
    100% { left: 100%; }
  }

  .btn-play-main:hover {
    transform: scale(1.1);
    filter: brightness(1.15);
    box-shadow: 
      inset 0 0 0 1px rgba(255,255,255,0.6),
      0 15px 40px rgba(0,0,0,0.9),
      0 0 70px rgba(232,200,120,0.7);
  }

  .btn-play-main:active {
    transform: scale(0.95);
  }

  .play-subtext {
    margin-top: 15px;
    font-family: 'Cinzel', serif;
    font-size: 14px;
    color: var(--gold-bright);
    letter-spacing: 3px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    opacity: 0.8;
  }

  /* ==================== RESPONSIVO ==================== */
  @media (max-width: 1100px) {
    .menu-plate { font-size: 13px; padding: 11px 20px; min-width: 180px; }
    .game-card { width: 140px; height: 200px; }
    .event-panel { width: 240px; padding: 16px; }
    .event-title { font-size: 17px; }
  }

  @media (max-width: 800px) {
    .menu-left { left: 12px; gap: 8px; }
    .menu-plate { font-size: 11px; padding: 9px 14px; min-width: 150px; letter-spacing: 1px; }
    .cards-fan { gap: 4px; bottom: 12px; }
    .game-card { width: 110px; height: 158px; }
    .card-nameplate { height: 36px; bottom: 8px; }
    .card-nameplate .nome { font-size: 10px; }
    .event-panel { width: 190px; bottom: 12px; right: 12px; padding: 12px; }
    .event-title { font-size: 14px; }
    .btn-jogar { font-size: 12px; padding: 10px; }
    .title-main { letter-spacing: 3px; }
  }
</style>
</head>
<body>

<!-- ==================== CENA ==================== -->
<div class="scene"></div>

<!-- ==================== TÍTULO ==================== -->
<div class="title-wrap">
  <h1 class="title-main">OLYMPUS:</h1>
  <p class="title-sub">Champions &amp; History</p>
</div>

<!-- ==================== BOTÃO PLAY CENTRAL ==================== -->
<div class="play-center">
  <button class="btn-play-main" onclick="window.location.href='/mesa/'">
    BATALHAR
  </button>
  <p class="play-subtext">ENCONTRAR PARTIDA ONLINE</p>
</div>

<!-- ==================== PLAYER (TOPO ESQUERDA) ==================== -->
<div class="player-panel">
  <div class="avatar-frame">
    <div class="avatar-img">🏛️</div>
  </div>
  <div class="player-stats">
    <div class="player-name">Player1</div>
    <div class="xp-bar-wrap">
      <div class="level-badge">15</div>
      <div class="xp-bar"><div class="xp-fill"></div></div>
    </div>
  </div>
</div>

<!-- ==================== MOEDAS (TOPO DIREITA) ==================== -->
<div class="currency-panel">
  <div class="currency-item">
    <div class="coin silver">✦</div>
    <span class="coin-label">Dracmas</span>
  </div>
  <div class="currency-item">
    <div class="coin gold">✦</div>
    <span class="coin-label">Ouro</span>
  </div>
</div>

<!-- ==================== MENU LATERAL ESQUERDO ==================== -->
<nav class="menu-left">
  <div class="menu-plate" onclick="irPara('campanha')">Campanha Histórica</div>
  <div class="menu-plate" onclick="window.location.href='/login/'">Entrar</div>
  <div class="menu-plate" onclick="window.location.href='/user/cards/'">Coleção de Cartas</div>
  <div class="menu-plate" onclick="window.location.href='/market/'">Loja</div>
  <div class="menu-plate" onclick="irPara('config')">Configurações</div>
</nav>

<!-- ==================== CARTAS EM LEQUE ==================== -->
<div class="cards-fan" id="cardsFan">

  <!-- Alexander, o Grande -->
  <div class="game-card" onclick="selecionarCarta(this)">
    <div class="card-portrait">
      <div class="placeholder">⚔️</div>
      <!-- <img src="alexander.jpg" alt="Alexander"> -->
    </div>
    <div class="card-cost">1</div>
    <div class="card-nameplate">
      <div class="nome">Alexander, o Grande</div>
    </div>
    <div class="card-stats">
      <div class="stat-badge atk">0</div>
      <div class="stat-badge hp">2</div>
    </div>
  </div>

  <!-- Leônidas (destaque) -->
  <div class="game-card featured" onclick="selecionarCarta(this)">
    <div class="card-portrait">
      <div class="placeholder">🛡️</div>
      <!-- <img src="leonidas.jpg" alt="Leônidas"> -->
    </div>
    <div class="card-cost">2</div>
    <div class="card-nameplate">
      <div class="nome">Leônidas</div>
    </div>
    <div class="card-stats">
      <div class="stat-badge atk">3</div>
      <div class="stat-badge hp">2</div>
    </div>
  </div>

  <!-- Atena -->
  <div class="game-card" onclick="selecionarCarta(this)">
    <div class="card-portrait">
      <div class="placeholder">🦉</div>
      <!-- <img src="athena.jpg" alt="Atena"> -->
    </div>
    <div class="card-cost">3</div>
    <div class="card-nameplate">
      <div class="nome">Atena</div>
    </div>
    <div class="card-stats">
      <div class="stat-badge atk">3</div>
      <div class="stat-badge hp">3</div>
    </div>
  </div>

</div>

<!-- ==================== EVENTO (INFERIOR DIREITO) ==================== -->
<div class="event-panel">
  <div class="event-label">Evento:</div>
  <div class="event-title">A GUERRA DE TROIA</div>
  <button class="btn-jogar" onclick="jogarEvento()">Jogar Agora</button>
</div>

<script>
/* ============================================================
   INTERAÇÕES
============================================================ */

function irPara(destino) {
  console.log('Navegando para:', destino);

  const acoes = {
    campanha: () => alert('🏛️ Iniciando Campanha Histórica...'),
    online:   () => alert('⚔️ Buscando oponentes online...'),
    colecao:  () => alert('📜 Abrindo coleção de cartas...'),
    loja:     () => alert('🏺 Bem-vindo à Loja do Oráculo!'),
    config:   () => alert('⚙️ Configurações')
  };

  (acoes[destino] || (() => {}))();
}

function selecionarCarta(cartaEl) {
  document.querySelectorAll('.game-card').forEach(c => c.classList.remove('featured'));
  cartaEl.classList.add('featured');

  const nome = cartaEl.querySelector('.nome').textContent;
  console.log('Carta selecionada:', nome);
}

function jogarEvento() {
  alert('🐴 EVENTO: A GUERRA DE TROIA\n\nPrepare seu deck! Os exércitos se aproximam...');
}

/* Efeito parallax sutil do mouse */
document.addEventListener('mousemove', (e) => {
  const x = (e.clientX / window.innerWidth  - 0.5) * 6;
  const y = (e.clientY / window.innerHeight - 0.5) * 6;

  const scene = document.querySelector('.scene');
  if (scene) {
    scene.style.transform = `scale(1.04) translate(${-x}px, ${-y}px)`;
  }
});

/* Animação suave de entrada */
window.addEventListener('load', () => {
  document.querySelectorAll('.menu-plate').forEach((el, i) => {
    el.style.opacity = '0';
    el.style.transform = 'translateX(-30px)';
    setTimeout(() => {
      el.style.transition = 'all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
      el.style.opacity = '1';
      el.style.transform = 'translateX(0)';
    }, 150 + i * 80);
  });

  document.querySelectorAll('.game-card').forEach((el, i) => {
    el.style.opacity = '0';
    setTimeout(() => {
      el.style.transition = 'opacity 0.5s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1)';
      el.style.opacity = '1';
    }, 400 + i * 120);
  });
});
</script>

</body>
</html>
